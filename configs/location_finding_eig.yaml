    - 102
    - 103
    - 104
    - 105
    evaluation_seeds:
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    previously_used_evaluation_seeds:
    - 1001
    - 63777278
    - 82937191
    checkpoint_selection: final_predeclared
    common_evaluation: likelihood_sPCE_nats
    required_architecture_controls: []
    secondary_metric: permutation_invariant_parameter_mse
    mse_convergence_required: true
    contrast_convergence_required: true
    online_cost_reported_separately: true
    claim_limit: Equal training episode pilot; unequal computational costs reported;
