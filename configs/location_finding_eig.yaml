    pilot_training_seed: 101
    pilot_evaluation_seed: 1001
    design_bounds:
    - -4.0
    - 4.0
    random_design_distribution: truncated_standard_normal
    training_episode_cap: 1000000
    full_study_training_episode_cap: 10000000
  rl_execution_limit_seconds: 2400
