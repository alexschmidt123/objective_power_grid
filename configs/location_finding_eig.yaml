      spce_lr_decay: 0.98
      spce_adam_beta1: 0.8
      spce_adam_beta2: 0.998
      spce_lr_schedule_every: 1000
  paper_protocol:
    reference: https://arxiv.org/html/2306.10430v2
    official_code: https://github.com/wgshen/vsOED
    upstream_commit: d0884f9ba30fbddc56618841c68af2f3bfe16539
    case: two_source_common_bounded_box
    regime: one_million_episode_pilot
    corrected_methods: true
    correction_note: All methods train and evaluate in [-4,4]^2. Random uses standard
      normal conditioned on the box; source prior remains iid standard normal. Equal1million
      primary training episodes. ScoreBED uses feasibility-only sigmoid adapter.
    nominal_training_trajectories: 1000000
    evaluation: shared_prior_bank_streamed_sPCE
    training_device: cuda
    checkpoint_selection: final
    observation_discrepancy: Paper Section 4.2 omits log; SOURCE.deterministic returns
      log(signal). Follow executable code.
    training_budget_unit: primary_episodes
    extensions: All fresh observed training episodes count, including MoE specialist
      and ScoreBED score pretraining. Contrast likelihood work, replay updates, validation
      and runtime reported separately.
  upstream_vsoed:
    variant: vsOED-G-I
    updates: 980
    paper_reference_updates: 10001
    budget_note: 20000 warmup plus 980*1000 new episodes equals 1000000; bounded
      designs with published incremental discount0.9.
    new_trajectories: 1000
    replay_batch: 10000
    initial_replay: 20000
    replay_capacity: 1000000
    posterior_updates: 5
    critic_updates: 5
    posterior_lr: 0.001
    actor_lr: 0.001
    critic_lr: 0.001
    lr_decay: 0.9999
    discount: 0.9
    exploration: 0.5
    exploration_decay: 0.9999
    target_rate: 0.1
    transition: 0
    log_every: 100
  plan:
    horizons:
    - 30
    routing: four_expert_DSelect1
    primary_metric: EIG_nats_common_sPCE_L1000000
    secondary_metric: parameter_MSE
    exclusions:
    - step_dad
    - mocu
    - msc
    - cost_utility
    - growing_tree
    - myopic
    moe_architecture: sPCE-only shared history encoder and four policy experts; DSelect1
