    spce_lr_decay: 0.98
    spce_lr_schedule_every: 1000
    batch_size: 64
    contrasts: 1024
    validation_contrasts: 16384
    validation_systems: 128
    validate_every: 100
    eval_systems: 2000
    eval_contrasts: 1000000
    evaluation_batch_size: 16
