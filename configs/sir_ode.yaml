# SIR ODE — vector-EIG sequential BOED (explicit Gaussian likelihood).
#
# Bank matches iDAD SIR settings (Ivanova et al. NeurIPS 2021 App. D.6 /
# epidemic_simulate_data.py), with ODE drift instead of SDE diffusion:
#   N=500, I0=2, S0=N−I0
#   t = linspace(0, 100, 10000)          # Δτ ≈ 10⁻²
#   prior: log(β,γ) ~ N([log 0.5, log 0.1], 0.5² I)
#   store full I(t) count table per θ; keep mean_t I ≥ 1
#   observe y = I(τ) + N(0, σ_y²)        # infected COUNT (not I/N)
#   ξ = measurement time, strictly increasing
#
# Training recipe (2026-08-13): soft two-step BC for DAD/RL/MoE (not hard myopic
# CE), PPO for RL + MoE, modest CF/branching for MoE, soft unique floor.
#
#   bash run.sh --config configs/sir_ode.yaml

system:
  name: sir_ode

N: 1

data:
  dataset_dir: data/sir_ode
  # Experiments are databank-only. Missing files are a hard error; the
  # train/evaluate pipeline never runs the ODE simulator on the fly.
  generate_if_missing: false

observation:
  # Scalar infected count I(τ) at the chosen time (not an IEEE trajectory length).
  # Small Gaussian noise for explicit DAD/sPCE (iDAD itself has no Poisson layer).
  noise_sigma: 1.0
  sampling: measurement_time

oracle:
  tolerance: 1.0e-4

sir_ode:
  # Exact iDAD App. D.6 / epidemic_simulate_data.py knobs
  population: 500.0
  i0: 2.0
  t_end: 100.0
  n_grid: 10000
  beta_mean: 0.5
  gamma_mean: 0.1
  log_std: 0.5
  min_mean_infected: 1.0
  # Discrete increasing-time designs on the same ODE grid (exclude t=0).
  n_actions: 100
  likelihood_sigma: 1.0

prior:
  # Poster package posterior resolution; fitted from the fixed databank only.
  mc_samples: 1024
  mc_support_seed: 1

experiment:
  step_number: 5
  methods: [dad, rl_sboed, moe_sboed, myopic, fixed, random]
  experiment_type: eig_based

data_generation:
  # iDAD pre-simulates 1e5; ODE is cheaper — use a large practical bank.
  theta_sample_size_train: 10000
  theta_sample_size_test: 3000
  train_seed: 101
  test_seed: 202

training:
  device: auto
  policy_hidden: 256
  # SIR supports eig_based only.
  eig_based:
    eig_epochs: 200
    eig_steps_per_epoch: 512
    batch_size: 256
    learning_rate: 0.0003
    # Higher entropy fights open-loop collapse (old SIR uniq≈12–20 vs myopic≈125).
    entropy_coef: 0.05
    eig_validation_systems: 256
    # Soft two-step BC: distill full ranking, not myopic argmax alone.
    eig_bc_trajectories: 128
    eig_bc_lookahead: two_step
    eig_bc_temperature: 0.5
    eig_bc_fantasies: 16
    eig_rl_use_ppo: true
    eig_moe_ppo_epochs: 4
    eig_moe_ppo_clip: 0.2
    eig_moe_critic_lr: 0.001
    # Real MoE: residuals/router only after base BC. No teacher ranking CE.
    eig_moe_cf_coefficient: 0.0
    eig_moe_cf_anneal_fraction: 0.0
    eig_moe_cf_floor_fraction: 0.0
    eig_moe_cf_rollouts_per_batch: 0
    eig_moe_freeze_base_after_bc: false
    eig_moe_leave_base_coefficient: 0.0
    eig_moe_leave_base_margin: 0.5
    eig_moe_branching_coefficient: 0.15
    eig_moe_low_ess_residual_coefficient: 0.10
    eig_moe_low_ess_threshold: 0.4
    eig_moe_residual_scale_coefficient: 0.05
    eig_moe_logit_scale_target: 3.5
    eig_moe_balance_coefficient: 0.05
    # Encourage confident expert choices that change with the posterior belief;
    # balancing above prevents this objective from collapsing to one expert.
    eig_moe_routing_information_coefficient: 0.01
    eig_moe_redundancy_coefficient: 0.02
    # Soft unique floor for checkpoint selection.
    eig_prefer_unique_sequence_floor: true
    eig_min_unique_sequence_fraction: 0.08
    eig_unique_floor_slack: 0.03

evaluation:
  # Development evaluation size; all systems come from the fixed test bank.
  eig_test_systems: 512

bank_quality:
  enabled: false

control_safety_calibration:
  enabled: false
