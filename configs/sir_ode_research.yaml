system:
  name: sir_ode
N: 1
experiment:
  experiment_type: eig_based
  step_number: 5
  methods:
  - random
  - fixed
  - dad
  - rl_sboed
  - vsoed
  - scorebed
  - moe_sboed
observation:
  noise_sigma: 1.0
  sampling: infected_count_at_continuous_time
sir_ode:
  population: 500.0
  i0: 2.0
  t_end: 100.0
  beta_mean: 0.5
  gamma_mean: 0.1
  log_std: 0.5
  min_spacing: 0.1
  integration_steps_per_stage: 512
research:
  enabled: true
  settings:
    eval_systems: 2048
    eval_contrasts: 16384
    moe_revision: 4
    moe_router_temperature: 1.0
    moe_specialist_budget_fraction: 0.25
    moe_density_updates: 4
    updates: 31250
    batch_size: 32
    learning_rate: 0.0003
    training_bound: 1
    primary_episode_budget: 1
    contrasts: 1024
    evaluation_population_systems: 2048
    evaluation_batch_size: 8
    evaluation_contrast_chunk: 128
    validation_systems: 128
    validation_contrasts: 1024
    rl_batch_size: 32
    rl_replay_batch: 256
    rl_replay_capacity: 100000
    rl_min_buffer: 1024
    rl_gradient_steps: 2
    rl_log_every: 10
    scorebed_batch_size: 64
    threads: 2
  plan:
    source: User-provided ChatGPT research plan
    horizons:
    - 5
    - 10
    training_repetitions: 5
    test_trajectories: 2048
    routing: four-expert DSelect1 sparse MoE
    training_criterion: sPCE
    online_policy_refinement: false
    primary_metric: common explicit-likelihood held-out EIG (sPCE)
    secondary_metric: parameter_MSE
    exclusions:
    - step_dad
    - myopic
    - mocu
    - msc
    - cost_utility
    - growing_tree
    moe_architecture: same sPCE-only sparse policy as location; no auxiliary networks
    data_source: on-the-fly deterministic SIR ODE; no finite latent bank
    legacy_results: Separate provenance only; discrete bank metrics not pooled
    scope: implementation and bounded CPU validation; full training not launched
  training_episode_cap: 1000000
  journal_protocol:
    version: validation_convergence_v1
    status: development_calibration_not_frozen
    comparison: validation_converged_policy_EIG
    budget_unit: method_specific_resource_safety_caps
    checkpoint_selection: best_predeclared_validation_EIG
    claim_limit: No confirmation until readiness, precision and settings are frozen;
      historical results are separate.
    development_training_seeds:
    - 201
    training_seeds:
    - 70101
    - 70102
    - 70103
    - 70104
    - 70105
    evaluation_seeds:
    - 8831001
    previously_used_evaluation_seeds:
    - 1001
    validation:
      seed: 772001
      systems: 128
      contrasts: 16384
      batch_size: 8
      chunk: 128
    stopping_rule:
      minimum_episodes: 16384
      minimum_checkpoints: 8
      validation_every_episodes: 4096
      patience: 6
      minimum_improvement: 0.01
      noise_multiplier: 1.96
      maximum_episodes: 1000000
      maximum_training_seconds: 3600.0
    common_pathwise_settings:
      hidden: 64
      contrasts: 1024
      moe_gradient_clip_mode: component
      moe_router_warmup_fraction: 0.3
      moe_router_finish_fraction: 0.95
      strategy_routing_mode: learned_switch
      strategy_initial_reroute_probability: 0.99
    method_settings:
