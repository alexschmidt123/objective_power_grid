derived_parameter_conventions:
  purpose: unit conversion reference, not an instantaneous-governor approximation
  M_formula: M_i = 2 H_i (S_i / S_base) / (2 pi f_base), for electrical angular-speed
    deviation in rad/s
  M_nominal_nodes:
  - 0.07098947081670899
  - 0.0165517066449028
  - 0.003870648215994895
  - 0.003870648215994895
  - 0.0019098593171027439
  - 0.0019098593171027439
  K_static_formula: K_i = (S_i / S_base) / (R_i f_base), in system-pu power per Hz;
    generator steady-state gain only
  K_static_nominal_nodes:
  - 2.9189189189189193
  - 0.06723571897570585
  - 0.0
  - 0.0
  - 0.0
  - 0.0
  warning: Use the BPA_GG time constants and limits; static K must not replace the
    governor dynamics
