  - 0.003870648215994895
  - 0.003870648215994895
  - 0.0019098593171027439
  - 0.0019098593171027439
  K_static_formula: K_i = (S_i / S_base) / (R_i f_base), in system-pu power per Hz; generator steady-state
    gain only
