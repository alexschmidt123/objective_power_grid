# Published IEEE30 dynamic reference: six machines, two governors, eight proposed latent coordinates.
# Full dynamic backend pending: this YAML must not execute with the legacy reduced swing solver.
# Source parameters are on each machine rated-MVA base; priors and probe/control choices are study assumptions.
